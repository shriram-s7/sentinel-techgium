<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1020" viewBox="0 0 2400 1020" font-family="Carlito">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#1b1f2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="70" width="1790" height="935" rx="28" fill="#f6f8fc" stroke="#c9ced8" stroke-width="3"/>
<text x="56" y="132" font-size="40" font-weight="700" fill="#1b1f2a">Inside the node</text>
<text x="350" y="132" font-size="34" fill="#5b6475">STM32G0 · 8 KB RAM · no cloud, no internet needed</text>
<circle cx="80" cy="204" r="24" fill="#2b4bd8"/><text x="80" y="215" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="116" y="217" font-size="40" font-weight="700" fill="#1b1f2a">Sense</text>
<circle cx="432" cy="204" r="24" fill="#2b4bd8"/><text x="432" y="215" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="468" y="217" font-size="40" font-weight="700" fill="#1b1f2a">Watch</text>
<circle cx="784" cy="204" r="24" fill="#2b4bd8"/><text x="784" y="215" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="820" y="217" font-size="40" font-weight="700" fill="#1b1f2a">Cross-check</text>
<circle cx="1136" cy="204" r="24" fill="#d99a00"/><text x="1136" y="215" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="1172" y="217" font-size="40" font-weight="700" fill="#1b1f2a">Decide</text>
<circle cx="1488" cy="204" r="24" fill="#2e9e5b"/><text x="1488" y="215" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="1524" y="217" font-size="40" font-weight="700" fill="#1b1f2a">Act</text>
<rect x="54" y="260" width="322" height="126" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="76" y="317.0" font-size="34" font-weight="700" fill="#1b1f2a">Chip temperature</text>
<text x="76" y="355.0" font-size="30" fill="#5b6475">built into the MCU</text>
<rect x="54" y="406" width="322" height="126" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="76" y="463.0" font-size="34" font-weight="700" fill="#1b1f2a">External sensor</text>
<text x="76" y="501.0" font-size="30" fill="#5b6475">the reading we sell</text>
<rect x="54" y="552" width="322" height="126" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="76" y="609.0" font-size="34" font-weight="700" fill="#1b1f2a">Supply current</text>
<text x="76" y="647.0" font-size="30" fill="#5b6475">INA219 + VREFINT</text>
<rect x="54" y="698" width="322" height="126" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="76" y="755.0" font-size="34" font-weight="700" fill="#1b1f2a">I²C transfers</text>
<text x="76" y="793.0" font-size="30" fill="#5b6475">ACK / NACK / timeout</text>
<rect x="54" y="844" width="322" height="126" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="76" y="901.0" font-size="34" font-weight="700" fill="#1b1f2a">Memory</text>
<text x="76" y="939.0" font-size="30" fill="#5b6475">flash CRC, stack, resets</text>
<rect x="406" y="260" width="322" height="710" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="430" y="320" font-size="34" font-weight="700" fill="#1b1f2a">Learns “normal”</text>
<text x="430" y="364" font-size="30" font-weight="400" fill="#5b6475">first 2 minutes</text>
<text x="430" y="430" font-size="34" font-weight="700" fill="#1b1f2a">Running average</text>
<text x="430" y="474" font-size="34" font-weight="700" fill="#1b1f2a">and spread</text>
<text x="430" y="518" font-size="30" font-weight="400" fill="#5b6475">3 numbers per signal</text>
<text x="430" y="584" font-size="34" font-weight="700" fill="#1b1f2a">Slow-drift counter</text>
<text x="430" y="628" font-size="30" font-weight="400" fill="#5b6475">(CUSUM) catches a</text>
<text x="430" y="672" font-size="30" font-weight="400" fill="#5b6475">creeping sensor</text>
<text x="430" y="738" font-size="34" font-weight="700" fill="#1b1f2a">Integer maths only</text>
<text x="430" y="782" font-size="30" font-weight="400" fill="#5b6475">no ML model</text>
<rect x="758" y="260" width="322" height="710" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="782" y="320" font-size="34" font-weight="700" fill="#1b1f2a">Is it me or</text><text x="782" y="362" font-size="34" font-weight="700" fill="#1b1f2a">the room?</text>
<line x1="782" y1="376" x2="1056" y2="376" stroke="#e5e8ee" stroke-width="2"/>
<text x="782" y="418" font-size="31" font-weight="700" fill="#1b1f2a">Both temps rise</text>
<text x="782" y="456" font-size="29" fill="#2e9e5b">→ room got warmer</text>
<line x1="782" y1="516" x2="1056" y2="516" stroke="#e5e8ee" stroke-width="2"/>
<text x="782" y="558" font-size="31" font-weight="700" fill="#1b1f2a">Only chip rises</text>
<text x="782" y="596" font-size="29" fill="#c8402e">→ board overheating</text>
<line x1="782" y1="656" x2="1056" y2="656" stroke="#e5e8ee" stroke-width="2"/>
<text x="782" y="698" font-size="31" font-weight="700" fill="#1b1f2a">Only sensor moves</text>
<text x="782" y="736" font-size="29" fill="#c8402e">→ sensor drifting</text>
<line x1="782" y1="796" x2="1056" y2="796" stroke="#e5e8ee" stroke-width="2"/>
<text x="782" y="838" font-size="31" font-weight="700" fill="#1b1f2a">Sensor jumps</text>
<text x="782" y="876" font-size="29" fill="#c8402e">→ noisy line</text>
<rect x="1130" y="300" width="242" height="84" rx="42" fill="#fff" stroke="#2e9e5b" stroke-width="4"/>
<text x="1251.0" y="354" font-size="36" font-weight="700" fill="#2e9e5b" text-anchor="middle">Healthy</text>
<rect x="1130" y="470" width="242" height="84" rx="42" fill="#fff" stroke="#d99a00" stroke-width="4"/>
<text x="1251.0" y="524" font-size="36" font-weight="700" fill="#d99a00" text-anchor="middle">Suspect</text>
<rect x="1130" y="640" width="242" height="84" rx="42" fill="#fff" stroke="#c8402e" stroke-width="4"/>
<text x="1251.0" y="694" font-size="36" font-weight="700" fill="#c8402e" text-anchor="middle">Confirmed</text>
<rect x="1130" y="810" width="242" height="84" rx="42" fill="#fff" stroke="#5b6475" stroke-width="4"/>
<text x="1251.0" y="864" font-size="36" font-weight="700" fill="#5b6475" text-anchor="middle">Degraded</text>
<path d="M1251.0,390 L1251.0,462" stroke="#1b1f2a" stroke-width="3" marker-end="url(#ar)"/>
<path d="M1251.0,560 L1251.0,632" stroke="#1b1f2a" stroke-width="3" marker-end="url(#ar)"/>
<path d="M1251.0,730 L1251.0,802" stroke="#1b1f2a" stroke-width="3" marker-end="url(#ar)"/>
<text x="1265.0" y="435" font-size="27" fill="#5b6475">1 odd reading</text>
<text x="1265.0" y="605" font-size="27" fill="#5b6475">3 in a row</text>
<text x="1265.0" y="775" font-size="27" fill="#5b6475">fix failed</text>
<path d="M1376,852 C1442,852 1442,342 1380,342" fill="none" stroke="#2e9e5b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arg)"/>
<text x="1251.0" y="945" font-size="27" fill="#2e9e5b" text-anchor="middle">dashed = recovered</text>
<rect x="1462" y="260" width="322" height="200" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="1484" y="320" font-size="34" font-weight="700" fill="#1b1f2a">Log</text>
<text x="1484" y="365" font-size="30" fill="#5b6475">event + time to a</text><text x="1484" y="405" font-size="30" fill="#5b6475">flash ring buffer</text>
<rect x="1462" y="485" width="322" height="230" rx="16" fill="#fff" stroke="#c9ced8" stroke-width="2.5"/>
<text x="1484" y="545" font-size="34" font-weight="700" fill="#1b1f2a">Recover</text>
<text x="1484" y="590" font-size="30" fill="#5b6475">reset the I²C bus</text>
<text x="1484" y="630" font-size="30" fill="#5b6475">slow the sampling</text>
<text x="1484" y="670" font-size="30" fill="#5b6475">fall back to chip temp</text>
<rect x="1462" y="740" width="322" height="230" rx="16" fill="#fff" stroke="#2e9e5b" stroke-width="3.5"/>
<text x="1484" y="800" font-size="34" font-weight="700" fill="#1b1f2a">Tag every reading</text>
<text x="1484" y="845" font-size="30" fill="#5b6475">1-byte health code</text>
<text x="1484" y="885" font-size="30" fill="#5b6475">sent with each value</text>
<text x="1484" y="925" font-size="30" fill="#5b6475">(like OPC UA quality)</text>
<path d="M379,615 L405,615" stroke="#1b1f2a" stroke-width="3.5" marker-end="url(#ar)"/>
<path d="M731,615 L757,615" stroke="#1b1f2a" stroke-width="3.5" marker-end="url(#ar)"/>
<path d="M1083,615 L1109,615" stroke="#1b1f2a" stroke-width="3.5" marker-end="url(#ar)"/>
<path d="M1435,615 L1461,615" stroke="#1b1f2a" stroke-width="3.5" marker-end="url(#ar)"/>
<path d="M1784,855 C1850,855 1800,370 1854,370" fill="none" stroke="#1b1f2a" stroke-width="3.5" marker-end="url(#ar)"/>
<text x="1860" y="132" font-size="40" font-weight="700" fill="#1b1f2a">What leaves the node</text>
<rect x="1860" y="240" width="520" height="300" rx="20" fill="#fff" stroke="#1b1f2a" stroke-width="3"/>
<text x="1888" y="302" font-size="36" font-weight="700" fill="#1b1f2a">Readings with a health tag</text>
<text x="1888" y="365" font-size="32" font-family="DejaVu Sans Mono" fill="#1b1f2a">31.42 °C</text><text x="2110" y="365" font-size="32" font-family="DejaVu Sans Mono" fill="#2e9e5b">h=0x00 ok</text>
<text x="1888" y="417" font-size="32" font-family="DejaVu Sans Mono" fill="#1b1f2a">31.47 °C</text><text x="2110" y="417" font-size="32" font-family="DejaVu Sans Mono" fill="#2e9e5b">h=0x00 ok</text>
<text x="1888" y="469" font-size="32" font-family="DejaVu Sans Mono" fill="#1b1f2a">29.10 °C</text><text x="2110" y="469" font-size="32" font-family="DejaVu Sans Mono" fill="#c8402e">h=0x82 drift</text>
<text x="1888" y="518" font-size="28" fill="#5b6475">bad data is flagged at the source</text>
<path d="M2120.0,548 L2120.0,610" stroke="#1b1f2a" stroke-width="3.5" marker-end="url(#ar)"/>
<rect x="1860" y="620" width="520" height="380" rx="20" fill="#fff" stroke="#1b1f2a" stroke-width="3"/>
<text x="1888" y="680" font-size="36" font-weight="700" fill="#1b1f2a">Fleet gateway</text>
<text x="1888" y="730" font-size="30" fill="#5b6475">16-byte report per node</text>
<text x="1888" y="774" font-size="30" fill="#5b6475">one node hot → device fault</text>
<text x="1888" y="818" font-size="30" fill="#5b6475">all nodes hot → weather</text>
<rect x="1888" y="890" width="44" height="44" rx="9" fill="none" stroke="#2e9e5b" stroke-width="4"/>
<rect x="1948" y="890" width="44" height="44" rx="9" fill="none" stroke="#2e9e5b" stroke-width="4"/>
<rect x="2008" y="890" width="44" height="44" rx="9" fill="none" stroke="#d99a00" stroke-width="4"/>
<rect x="2068" y="890" width="44" height="44" rx="9" fill="none" stroke="#2e9e5b" stroke-width="4"/>
<rect x="2128" y="890" width="44" height="44" rx="9" fill="none" stroke="#c8402e" stroke-width="4"/>
<rect x="2188" y="890" width="44" height="44" rx="9" fill="none" stroke="#2e9e5b" stroke-width="4"/>
<rect x="2248" y="890" width="44" height="44" rx="9" fill="none" stroke="#2e9e5b" stroke-width="4"/>
<rect x="2308" y="890" width="44" height="44" rx="9" fill="none" stroke="#2e9e5b" stroke-width="4"/>
</svg>